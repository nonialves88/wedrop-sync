name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  seguranca-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-sync/requirements.txt
      - run: pip install -r api-sync/requirements.txt
      - name: Barreira anti-vazamento (repositório público)
        run: python scripts/check_public_safe.py
      - name: Testes
        working-directory: api-sync
        run: python -m unittest discover -s tests -t . -q
